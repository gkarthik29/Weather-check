<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('{{image_url}}'); /* Make sure the path is correct */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh; /* Ensure full viewport height */
            display: flex;
            flex-direction: column; /* Align items vertically */
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.6); /* Slightly darker overlay */
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            width: 90%; /* Occupy most of the screen on smaller devices */
            max-width: 600px; /* Set a maximum width */
        }

        .btn-custom {
            background-color: #007bff; /* Use a Bootstrap color */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }

        .weather-info {
            margin-top: 20px;
            text-align: left; /* Align text to the left within the info box */
        }

        .weather-info p {
            margin: 5px 0; /* Reduce margin for better spacing */
            font-size: 1rem; /* Slightly smaller font size */
        }

        /* Add some spacing and a background to the data values */
        .weather-info span {
            font-weight: bold;
            padding: 3px 5px;
            background-color: rgba(255, 255, 255, 0.2); /* Semi-transparent white */
            border-radius: 3px;
            margin-left: 5px; /* Space between label and value */
        }

        /* Style the error message */
        .error-message {
            color: #ffc107; /* Use a warning color */
            margin-top: 10px;
        }

        /* Style the input field */
        .form-control {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Weather Information</h1>
        <form method="POST">
            <div class="mb-3">
                <label for="city" class="form-label">City:</label>
                <input type="text" id="city" name="city" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-custom">Get Weather</button>
        </form>

        <div class="weather-info">
            {% if data.error %}
                <p class="error-message">{{ data.error }}</p>
            {% else %}
                <p><strong>Country Code:</strong> <span>{{ data.country_code }}</span></p>
                <p><strong>Coordinates:</strong> <span>{{ data.coordinate }}</span></p>
                <p><strong>Temperature:</strong> <span>{{ data.temp }}</span></p>
                <p><strong>Pressure:</strong> <span>{{ data.pressure }} hPa</span></p>
                <p><strong>Humidity:</strong> <span>{{ data.humidity }}%</span></p>
                <p><strong>Description:</strong> <span>{{ data.description }}</span></p>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
